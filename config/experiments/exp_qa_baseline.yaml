# Question Answering Few-Shot Baseline Experiment Configuration

experiment:
  name: "Question Answering FSL Trial"
  description: "Evaluating QA correctness using 5-shot example-based prompts"
  seed: 202
  repeated_trials: 3
  output_dir: "results"

dataset:
  name: "squad_v2"
  task: "question_answering"
  split: "validation"
  sample_size: 150

prompt:
  strategy: "example_based"
  instruction_text: "Answer the question based strictly on the provided context."

few_shot:
  num_examples: 5
  ordering: "original"
  diversity: "high"

model:
  name: "gpt-4o-mini"
  provider: "openai"
  temperature: 0.1
  max_tokens: 512

evaluation:
  metrics:
    - "response_correctness"
    - "completeness"
    - "relevance"
    - "latency_seconds"
    - "token_usage"
