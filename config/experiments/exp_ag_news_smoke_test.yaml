# AG News Llama 3.1 Real Smoke Test Configuration

experiment:
  name: "AG News Llama 3.1 Real Smoke Test"
  description: "Deterministic real Ollama evaluation on AG News using 3-shot hybrid prompting"
  seed: 42
  repeated_trials: 3
  output_dir: "results"

dataset:
  name: "ag_news"
  task: "text_classification"
  split: "test"
  sample_size: 10

prompt:
  strategy: "hybrid"
  instruction_text: "Classify the input text into exactly one of the designated target categories: World, Sports, Business, Sci/Tech. Respond with ONLY the single chosen category label and nothing else."

few_shot:
  num_examples: 3
  ordering: "random"
  diversity: "medium"

model:
  name: "llama3.1:latest"
  provider: "ollama"
  temperature: 0.0
  max_tokens: 128

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "latency_seconds"
    - "token_usage"
