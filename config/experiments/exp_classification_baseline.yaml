# Text Classification Few-Shot Baseline Experiment Configuration

experiment:
  name: "Text Classification FSL Trial"
  description: "Evaluating news classification using 3-shot hybrid prompts"
  seed: 101
  repeated_trials: 3
  output_dir: "results"

dataset:
  name: "ag_news"
  task: "text_classification"
  split: "test"
  sample_size: 200

prompt:
  strategy: "hybrid"
  instruction_text: "Classify the article headline into World, Sports, Business, or Sci/Tech."

few_shot:
  num_examples: 3
  ordering: "random"
  diversity: "medium"

model:
  name: "gpt-3.5-turbo"
  provider: "openai"
  temperature: 0.0
  max_tokens: 256

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "latency_seconds"
    - "token_usage"
